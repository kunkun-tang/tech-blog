name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: "0.167.0"
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
    steps:
      - name: Check out repository and theme
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$release_url/$archive"
          curl --fail --location --retry 3 --output checksums.txt "$release_url/hugo_${HUGO_VERSION}_checksums.txt"
          grep "  ${archive}$" checksums.txt | sha256sum --check
          mkdir -p hugo-bin
          tar -xzf "$archive" -C hugo-bin
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: hugo --gc --minify

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
